# `make check` on every push, on Linux and macOS: the platforms the README
# supports. Windows is left out because pma-core uses Unix-only process and
# permission APIs.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      # `make test` runs the scripts/ tests through uv.
      - uses: astral-sh/setup-uv@v7
      - name: make check
        run: make check
