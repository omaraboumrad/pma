[package]
name = "pma"
description = "Maintain many git repositories from one place: rank their TODO.md tasks and hand them to coding agents"
readme = "../../README.md"
keywords = ["todo", "eisenhower", "git", "maintenance", "cli"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pma-core.workspace = true
pma-tui.workspace = true
pma-web = { workspace = true, optional = true }
clap.workspace = true
serde_json.workspace = true

[features]
# `pma web`. Off, the binary carries no HTTP server.
default = ["web"]
web = ["dep:pma-web"]

[dev-dependencies]
rusqlite.workspace = true
